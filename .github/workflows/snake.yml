name: Generate Contribution Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate blue snake
        uses: Platane/snk@v3
        with:
          github_user_name: Gledsons7
          outputs: |
            dist/github-snake.svg?palette=github&color_snake=%231677D2&color_dots=%23EAF4FF,%23BFDBFE,%2360A5FA,%232563EB,%230B3D91
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2338BDF8&color_dots=%230D1117,%230B1F4D,%231D4ED8,%231677D2,%2338BDF8

      - name: Publish snake
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: output
